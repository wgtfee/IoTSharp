name: IoTSharp Develop Platform Contract

on:
  push:
    branches: [ Develop ]
  pull_request:
    branches: [ Develop ]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: Develop
          fetch-depth: 0

      - name: Apply V7 workbench integration
        run: python scripts/v7_workbench_finish.py

      - name: Verify V7 frontend build
        working-directory: ClientApp
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit final V7 workbench integration and cleanup
        run: |
          git config user.name "wgtfee"
          git config user.email "57023277+wgtfee@users.noreply.github.com"
          git add -A
          git commit -m "fix(twin-v7): wire V7 components into workbench"
          git push origin Develop

      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'ci/iot-platform-contract',
              description: passed ? 'IoT platform contract passed' : 'IoT platform contract failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
