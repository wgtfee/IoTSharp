name: Temporary V7 Component Controller Recheck

on:
  push:
    branches: [Develop]
    paths:
      - '.github/workflows/tmp-v7-dotnet-component-recheck.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: Develop
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ./IoTSharp/IoTSharp.csproj
      - name: Build and retain log
        shell: bash
        run: |
          set +e
          dotnet build ./IoTSharp/IoTSharp.csproj --configuration Release --no-restore 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "--- V7 controller diagnostics ---"
          grep -n "TwinComponentResourcesController.cs" /tmp/build.log || true
          echo "Underlying build exit code: $status"
          # The repository currently has missing Industrial.Security/Health projects.
          # This verification job succeeds when our controller no longer appears in compiler errors.
          if grep "TwinComponentResourcesController.cs" /tmp/build.log | grep -q "error CS"; then
            exit 1
          fi
          exit 0
